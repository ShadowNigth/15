name: Local body and wrist QA
on:
  push:
    paths:
      - 'scripts/actors/FirstPersonBody.gd'
      - 'scripts/actors/AgentViewArms.gd'
      - 'scripts/actors/PlayerController.gd'
      - 'tests/FirstPersonBodyTest*'
      - '.github/workflows/first-person-body-qa.yml'
  workflow_dispatch:
concurrency:
  group: local-body-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  local-body:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and rendering dependencies
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          pip install pillow gdtoolkit==4.3.4
      - name: Import and static validation
        run: |
          set -o pipefail
          python tools/verify_godot_project.py
          godot --headless --path . --import 2>&1 | tee /tmp/local-import.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:' /tmp/local-import.log
      - name: Eight agents walking crouching and respawning
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 timeout 360s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 60 --resolution 960x540 res://tests/FirstPersonBodyTest.tscn 2>&1 | tee /tmp/local-body.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|FAIL:' /tmp/local-body.log
          grep -q '\[LOCAL BODY\] PASS:' /tmp/local-body.log
      - name: Dedicated sleeve and original glove regression
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 timeout 600s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility res://tests/AgentViewArmsTest.tscn 2>&1 | tee /tmp/local-arms.log
          grep -q '\[AGENT ARMS\] PASS:' /tmp/local-arms.log
      - name: Actual weapon and knife wrist inspections
        run: |
          set -o pipefail
          MODERN_CAPTURE_DIR=/tmp/modern-captures LIBGL_ALWAYS_SOFTWARE=1 timeout 600s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 60 --resolution 960x540 res://tests/CosmeticExpansionTest.tscn 2>&1 | tee /tmp/local-wrist.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|FAIL:' /tmp/local-wrist.log
          grep -q 'PASS: Cosmetics' /tmp/local-wrist.log
      - name: Execution diagnostics
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['local-import','local-body','local-wrist','local-arms']:
              p=Path('/tmp/'+name+'.log')
              if p.exists():
                  lines=p.read_text(errors='replace').splitlines()
                  text='\n'.join(x for x in lines if any(k in x for k in ['SCRIPT ERROR','ERROR:','at:','PASS:']))[-6000:]
                  if text: print('::notice title='+name+'::'+text.replace('%','%25').replace('\n','%0A'))
          PY
      - name: Phoenix natural look down Glock
        if: always()
        run: python tools/publish_modern_capture.py local_body_terror_down_70
      - name: SAS natural look down Glock
        if: always()
        run: python tools/publish_modern_capture.py local_body_sas_down_70
      - name: SAS straight down Glock
        if: always()
        run: python tools/publish_modern_capture.py local_body_sas_down_89
      - name: Phoenix straight down Glock
        if: always()
        run: python tools/publish_modern_capture.py local_body_terror_down_89
      - name: Leet walking Glock
        if: always()
        run: python tools/publish_modern_capture.py local_body_leet_walk
      - name: Glock wrist and gloves
        if: always()
        run: python tools/publish_modern_capture.py wrist_sas_classic_inspect_4
      - name: Native late knife inspection
        if: always()
        run: python tools/publish_modern_capture.py wrist_sas_classic_inspect_8
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 3
        with:
          name: local-body-wrist-evidence
          path: |
            /tmp/local-*.log
            /tmp/modern-captures/
