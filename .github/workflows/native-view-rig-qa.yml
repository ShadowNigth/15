name: Native view skeleton QA
on:
  push:
    paths:
      - 'assets/models/native_view/**'
      - 'data/native_view_rigs.json'
      - 'assets/textures/native_sport/**'
      - 'scripts/actors/NativeViewRig.gd'
      - 'scripts/ui/MainMenu.gd'
      - 'tests/NativeViewRigTest*'
      - 'data/agent_view_arms.json'
      - 'tests/WristSeamTest*'
      - 'tests/SmokeOutTest*'
      - 'data/sport_gloves.json'
      - 'scripts/actors/AgentViewArms.gd'
      - 'scripts/actors/WristSeamFit.gd'
      - 'scripts/actors/PlayerController.gd'
      - '.github/workflows/native-view-rig-qa.yml'
  workflow_dispatch:
concurrency:
  group: native-view-rig-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  local-body:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and rendering dependencies
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          pip install pillow gdtoolkit==4.3.4
      - uses: actions/cache/restore@v4
        id: godot-import
        with:
          path: .godot
          key: native-view-import-${{ runner.os }}-${{ hashFiles('assets/models/native_view/*.glb') }}
          restore-keys: native-view-import-${{ runner.os }}-
      - name: Import and static validation
        run: |
          set -o pipefail
          python tools/verify_godot_project.py
          godot --headless --path . --import 2>&1 | tee /tmp/local-import.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:' /tmp/local-import.log
      - uses: actions/cache/save@v4
        if: steps.godot-import.outputs.cache-hit != 'true'
        with:
          path: .godot
          key: native-view-import-${{ runner.os }}-${{ hashFiles('assets/models/native_view/*.glb') }}
      - name: Native AK pilot
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 timeout 240s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 60 --resolution 960x540 res://tests/NativeViewRigTest.tscn -- --pilot-only 2>&1 | tee /tmp/local-native.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|^ERROR:|FAIL:' /tmp/local-native.log
          grep -q '\[NATIVE VIEW\] PASS:' /tmp/local-native.log
      - name: Execution diagnostics
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['local-import','local-native']:
              p=Path('/tmp/'+name+'.log')
              if p.exists():
                  lines=p.read_text(errors='replace').splitlines()
                  text='\n'.join(x for x in lines if any(k in x for k in ['SCRIPT ERROR','ERROR:','at:','PASS:']))[-3500:]
                  if text: print('::notice title='+name+'::'+text.replace('%','%25').replace('\n','%0A'))
          PY
      - name: Render native_ak47_idle
        if: always()
        run: python tools/publish_modern_capture.py native_ak47_idle
      - name: Render native_ak47_shoot
        if: always()
        run: python tools/publish_modern_capture.py native_ak47_shoot
      - name: Render native_ak47_reload
        if: always()
        run: python tools/publish_modern_capture.py native_ak47_reload
      - name: Render native_ak47_inspect
        if: always()
        run: python tools/publish_modern_capture.py native_ak47_inspect
      - name: Render native_ak47_reload_start
        if: always()
        run: python tools/publish_modern_capture.py native_ak47_reload_start
      - name: Render native_ak47_reload_end
        if: always()
        run: python tools/publish_modern_capture.py native_ak47_reload_end
      - name: Render native_ak47_inspect_start
        if: always()
        run: python tools/publish_modern_capture.py native_ak47_inspect_start
      - name: Render native_ak47_inspect_end
        if: always()
        run: python tools/publish_modern_capture.py native_ak47_inspect_end
      - name: Render native_karambit_inspect_start
        if: always()
        run: python tools/publish_modern_capture.py native_karambit_inspect_start
      - name: Render native_karambit_inspect_mid
        if: always()
        run: python tools/publish_modern_capture.py native_karambit_inspect_mid
      - name: Render native_karambit_inspect_end
        if: always()
        run: python tools/publish_modern_capture.py native_karambit_inspect_end
      - name: Render native_leet_ak47_idle
        if: always()
        run: python tools/publish_modern_capture.py native_leet_ak47_idle
      - name: Render native_karambit_inspect
        if: always()
        run: python tools/publish_modern_capture.py native_karambit_inspect
      - name: Render native_arsenal_gloves
        if: always()
        run: python tools/publish_modern_capture.py native_arsenal_gloves
      - name: Render native_arsenal_gloves_left
        if: always()
        run: python tools/publish_modern_capture.py native_arsenal_gloves_left
      - name: Render native_arsenal_gloves_right
        if: always()
        run: python tools/publish_modern_capture.py native_arsenal_gloves_right
      - name: Render native_arsenal_gloves_back
        if: always()
        run: python tools/publish_modern_capture.py native_arsenal_gloves_back
      - name: Render native_arsenal_gloves_top
        if: always()
        run: python tools/publish_modern_capture.py native_arsenal_gloves_top
      - name: Render native_arsenal_gloves_bottom
        if: always()
        run: python tools/publish_modern_capture.py native_arsenal_gloves_bottom
      - name: Render native_arsenal_gloves_closeup
        if: always()
        run: python tools/publish_modern_capture.py native_arsenal_gloves_closeup
      - name: Render native_arsenal_inspect_start
        if: always()
        run: python tools/publish_modern_capture.py native_arsenal_inspect_start
      - name: Render native_arsenal_inspect_mid
        if: always()
        run: python tools/publish_modern_capture.py native_arsenal_inspect_mid
      - name: Render native_arsenal_inspect_end
        if: always()
        run: python tools/publish_modern_capture.py native_arsenal_inspect_end
      - name: Render native_arsenal_inspect
        if: always()
        run: python tools/publish_modern_capture.py native_arsenal_inspect
      - name: Render native_existing_sport_ak47
        if: always()
        run: python tools/publish_modern_capture.py native_existing_sport_ak47
      - name: Full native weapon knife and agent animation matrix
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 timeout 1200s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 60 --resolution 960x540 res://tests/NativeViewRigTest.tscn 2>&1 | tee /tmp/local-matrix.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|^ERROR:|FAIL:' /tmp/local-matrix.log
          grep -q '\[NATIVE VIEW\] PASS:' /tmp/local-matrix.log
      - name: Matrix diagnostics
        if: always()
        run: |
          python - <<'PY_DIAG'
          from pathlib import Path
          p=Path('/tmp/local-matrix.log')
          if p.exists():
              text='\n'.join(x for x in p.read_text(errors='replace').splitlines() if any(k in x for k in ['SCRIPT ERROR','ERROR:','at:','PASS:','FAIL:']))[-3500:]
              print('::notice title=local-matrix::'+text.replace('%','%25').replace('\n','%0A'))
          PY_DIAG
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 3
        with:
          name: wrist-seam-evidence
          path: |
            /tmp/local-*.log
            /tmp/modern-captures/
