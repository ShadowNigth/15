      - name: Render native_arsenal_inspect_start
        if: always()
        run: python tools/publish_modern_capture.py native_arsenal_inspect_start
      - name: Render native_arsenal_inspect_mid
        if: always()
        run: python tools/publish_modern_capture.py native_arsenal_inspect_mid
      - name: Render native_arsenal_inspect_end
        if: always()
        run: python tools/publish_modern_capture.py native_arsenal_inspect_end
  karambit-captures:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and rendering dependencies
        run: |
