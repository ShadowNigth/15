name: Motion and utility presentation QA
on:
  push:
    paths:
      - 'scripts/actors/ModernAgentPose.gd'
      - 'scripts/actors/PlayerController.gd'
      - 'scripts/weapons/C4Display.gd'
      - 'scripts/core/GameData.gd'
      - 'assets/shaders/molotov*'
      - 'data/c4_display.json'
      - 'tests/MotionUtilityPresentationTest*'
      - '.github/workflows/motion-utility-qa.yml'
  workflow_dispatch:
concurrency:
  group: motion-utility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install engine and renderer
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          pip install pillow gdtoolkit==4.3.4
      - name: Validate and import
        run: |
          set -o pipefail
          python tools/verify_godot_project.py
          godot --headless --path . --import 2>&1 | tee /tmp/motion-import.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:' /tmp/motion-import.log
      - name: Real locomotion C4 display and molotov rendering
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 timeout 600s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 60 --resolution 960x540 res://tests/MotionUtilityPresentationTest.tscn 2>&1 | tee /tmp/motion-utility.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|SHADER ERROR|FAIL:' /tmp/motion-utility.log
          grep -q '\[MOTION UTILITY\] PASS:' /tmp/motion-utility.log
      - name: Diagnostics
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['motion-import','motion-utility']:
              p=Path('/tmp/'+name+'.log')
              if p.exists():
                  lines=list(dict.fromkeys(p.read_text(errors='replace').splitlines()))
                  text='\n'.join(x for x in lines if any(k in x for k in ['[MOTION UTILITY]','SCRIPT ERROR','ERROR:',' at: ','Error:']))[-6000:]
                  print('::notice title='+name+'::'+text.replace('%','%25').replace('\n','%0A'))
          PY
      - name: C4 LCD planting
        if: always()
        run: python tools/publish_modern_capture.py c4_digits_15
      - name: C4 LCD final code
        if: always()
        run: python tools/publish_modern_capture.py c4_digits_29
      - name: Green molotov
        if: always()
        run: python tools/publish_modern_capture.py molotov_green
      - name: Crouch jump
        if: always()
        run: python tools/publish_modern_capture.py motion_crouch_jump
      - name: Diagonal locomotion
        if: always()
        run: python tools/publish_modern_capture.py motion_diagonal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion-utility-evidence
          path: |
            /tmp/motion-*.log
            /tmp/modern-captures/
