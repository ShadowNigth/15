name: Hitbox and weapon accuracy QA
on:
  push:
    paths:
      - 'scripts/actors/**'
      - 'scripts/weapons/**'
      - 'scripts/world/GrenadeProjectile.gd'
      - 'scripts/world/DroppedWeapon.gd'
      - 'scripts/core/GameData.gd'
      - 'scripts/ui/MainMenu.gd'
      - 'tests/HitboxAccuracyTest*'
      - '.github/workflows/movement-profile-qa.yml'
  workflow_dispatch:
concurrency:
  group: hitbox-accuracy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  movement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/movement-import.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:' /tmp/movement-import.log
      - name: Eight-agent head rays and weapon accuracy/recovery
        run: |
          set -o pipefail
          timeout 240s godot --headless --path . --fixed-fps 60 res://tests/HitboxAccuracyTest.tscn 2>&1 | tee /tmp/movement.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|FAIL:' /tmp/movement.log
          grep -q '\[HITBOX ACCURACY\] PASS:' /tmp/movement.log
      - name: Render fitted head regions on actual agents
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          pip install pillow
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 timeout 240s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --resolution 960x540 --fixed-fps 60 res://tests/HitboxAccuracyTest.tscn -- --capture 2>&1 | tee /tmp/hitbox-render.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|FAIL:' /tmp/hitbox-render.log
          grep -q '\[HITBOX ACCURACY\] PASS:' /tmp/hitbox-render.log
      - name: SAS fitted head
        if: always()
        run: python tools/publish_modern_capture.py hitbox_modern_sas_stand
      - name: FBI crouched fitted head
        if: always()
        run: python tools/publish_modern_capture.py hitbox_modern_urban_duck
      - name: Leet fitted head
        if: always()
        run: python tools/publish_modern_capture.py hitbox_modern_leet_stand
      - name: Phoenix fitted head
        if: always()
        run: python tools/publish_modern_capture.py hitbox_modern_guerilla_stand
      - name: Diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['movement-import', 'movement', 'hitbox-render']:
              p = Path('/tmp/' + name + '.log')
              if p.exists():
                  lines = list(dict.fromkeys(p.read_text(errors='replace').splitlines()))
                  lines = [x for x in lines if any(k in x for k in ['[HITBOX ACCURACY]', 'ERROR:', ' at: ', 'Error:'])]
                  text = '\n'.join(lines)[-6000:].replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
                  print('::notice title=' + name + '::' + text)
          PY
