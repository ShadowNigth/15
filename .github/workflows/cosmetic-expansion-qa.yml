name: Compatible cosmetic expansion QA
on:
  push:
    paths:
      - 'assets/models/modern/**'
      - 'assets/textures/cs2go/**'
      - 'data/**'
      - 'scripts/actors/**'
      - 'scripts/core/GameData.gd'
      - 'scripts/ui/**'
      - 'tests/CosmeticExpansionTest*'
      - '.github/workflows/cosmetic-expansion-qa.yml'
  workflow_dispatch:
concurrency:
  group: cosmetic-expansion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatible-cosmetics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and rendering dependencies
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          pip install pillow gdtoolkit==4.3.4
      - name: Import and static validation
        run: |
          set -o pipefail
          python tools/verify_godot_project.py
          godot --headless --path . --import 2>&1 | tee /tmp/cosmetics-import.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:' /tmp/cosmetics-import.log
      - name: Actual paints native gloves and eight animated agents
        run: |
          set -o pipefail
          MODERN_CAPTURE_DIR=/tmp/modern-captures LIBGL_ALWAYS_SOFTWARE=1 timeout 600s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 60 res://tests/CosmeticExpansionTest.tscn 2>&1 | tee /tmp/cosmetics.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|SHADER ERROR|FAIL:' /tmp/cosmetics.log
          grep -q 'PASS: Cosmetics' /tmp/cosmetics.log
      - name: Actionable diagnostics
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['cosmetics-import','cosmetics']:
              p=Path('/tmp/'+name+'.log')
              if p.exists():
                  lines=p.read_text(errors='replace').splitlines()
                  text='\n'.join(x for x in lines if any(k in x for k in ['SCRIPT ERROR','ERROR:','at:','PASS:']))[-6000:]
                  if text:print('::notice title='+name+'::'+text.replace('%','%25').replace('\n','%0A'))
          PY
      - name: Rendered agents
        if: always()
        run: python tools/publish_modern_capture.py cosmetic_agents
      - name: Rendered moving agents
        if: always()
        run: python tools/publish_modern_capture.py cosmetic_agents_motion
      - name: Rendered AK paint and Sport gloves
        if: always()
        run: python tools/publish_modern_capture.py cosmetic_ak47
      - name: Rendered M4 paint and Sport gloves
        if: always()
        run: python tools/publish_modern_capture.py cosmetic_m4a1
      - name: Rendered AWP paint and Sport gloves
        if: always()
        run: python tools/publish_modern_capture.py cosmetic_awp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatible-cosmetics-evidence
          path: |
            /tmp/cosmetics*.log
            /tmp/modern-captures/
