name: Menu and Arsenal QA
on:
  push:
    paths:
      - 'scripts/ui/MainMenu.gd'
      - 'scripts/ui/MenuBackdrop.gd'
      - 'tests/MainMenuPresentationTest*'
      - 'tools/publish_menu_capture.py'
      - '.github/workflows/menu-presentation-qa.yml'
  workflow_dispatch:
concurrency:
  group: menu-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and OpenGL
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          pip install pillow gdtoolkit==4.3.4
      - name: Validate and import
        id: compile
        run: |
          set -o pipefail
          python tools/verify_godot_project.py
          godot --headless --path . --import 2>&1 | tee /tmp/menu-import.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:' /tmp/menu-import.log
      - name: Render and interact with menu and arsenal
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          set -o pipefail
          MENU_CAPTURE_DIR=/tmp/menu-captures LIBGL_ALWAYS_SOFTWARE=1 timeout 240s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 60 res://tests/MainMenuPresentationTest.tscn 2>&1 | tee /tmp/menu-runtime.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|SHADER ERROR' /tmp/menu-runtime.log
          grep -q 'PASS:' /tmp/menu-runtime.log
      - name: Native preview and editor regressions
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          set -o pipefail
          status=0
          for suite in NativeGunAnimationTest KnifeLoadoutTest UICustomizationTest; do
            if ! timeout 420s godot --headless --path . --fixed-fps 60 res://tests/$suite.tscn 2>&1 | tee /tmp/$suite.log; then status=1; fi
            if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:' /tmp/$suite.log; then status=1; fi
            if ! grep -q 'PASS:' /tmp/$suite.log; then status=1; fi
          done
          exit "$status"
      - name: Menu diagnostics
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename in ['menu-import', 'menu-runtime', 'NativeGunAnimationTest', 'KnifeLoadoutTest', 'UICustomizationTest']:
              p = Path('/tmp') / (filename + '.log')
              if p.exists():
                  lines = p.read_text(errors='replace').splitlines()
                  text = '\n'.join(x for x in lines if any(k in x for k in ['ERROR', 'Error', 'FAIL', 'PASS:']))[-6500:]
                  print('::notice title='+filename+'::'+text.replace('%','%25').replace('\n','%0A'))
          PY
      - name: Relaxed agent framebuffer
        if: always()
        run: python tools/publish_menu_capture.py menu_agent_relaxed
      - name: Glove inspection framebuffer
        if: always()
        run: python tools/publish_menu_capture.py menu_gloves_inspect
      - name: Home framebuffer
        if: always()
        run: python tools/publish_menu_capture.py menu_home
      - name: Arsenal framebuffer
        if: always()
        run: python tools/publish_menu_capture.py menu_arsenal
      - name: Arsenal 4x3 framebuffer
        if: always()
        run: python tools/publish_menu_capture.py menu_arsenal_4x3
      - name: Home 4x3 framebuffer
        if: always()
        run: python tools/publish_menu_capture.py menu_home_4x3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menu-evidence
          path: |
            /tmp/menu-*.log
            /tmp/*Test.log
            /tmp/menu-captures/
