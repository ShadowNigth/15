name: Squad and interaction QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'tests/SquadInteractionTest*'
      - 'tests/UtilityPropagationTest*'
      - '.github/workflows/squad-systems-qa.yml'
concurrency:
  group: squad-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Static validation
        run: |
          pip install gdtoolkit==4.3.4
          python tools/verify_godot_project.py
      - name: Install Godot
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import and compile
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/squad-import.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:' /tmp/squad-import.log
      - name: Real physics, input, native animation and audio regressions
        shell: bash
        run: |
          set -o pipefail
          for suite in SquadInteractionTest UtilityPropagationTest NativeGunAnimationTest NativeAudioTest KillFirePolishTest; do
            timeout 420s godot --headless --path . --fixed-fps 60 "res://tests/$suite.tscn" 2>&1 | tee "/tmp/$suite.log"
            ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:' "/tmp/$suite.log"
            grep -q 'PASS:' "/tmp/$suite.log"
          done
      - name: Diagnostic logs
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in [Path('/tmp/squad-import.log'), *Path('/tmp').glob('*Test.log')]:
              if p.exists():
                  text = p.read_text(errors='replace')
                  errors = [s for s in text.splitlines() if any(k in s for k in ['SCRIPT ERROR', 'Parse Error', 'Compile Error', 'FAIL', 'PASS:'])]
                  message = '\n'.join(errors)[-7000:].replace('%', '%25').replace('\n', '%0A').replace('\r','%0D')
                  print(f'::notice title={p.name}::{message}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: squad-systems-logs
          path: |
            /tmp/squad-import.log
            /tmp/*Test.log
