name: Squad and interaction QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'tests/SquadInteractionTest*'
      - 'tests/SquadGameplayTest*'
      - 'tests/UtilityPropagationTest*'
      - '.github/workflows/squad-systems-qa.yml'
      - 'tools/publish_squad_capture.py'
concurrency:
  group: squad-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Static validation
        run: |
          pip install gdtoolkit==4.3.4
          python tools/verify_godot_project.py
      - name: Install Godot
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Restore CI-only imported resources
        uses: actions/cache/restore@v4
        id: imports
        with:
          path: .godot/imported
          key: squad-godot43-${{ runner.os }}-${{ hashFiles('assets/**', 'project.godot') }}
      - name: Import and compile
        id: compile
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/squad-import.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:' /tmp/squad-import.log
      - name: Real physics, input, native animation and audio regressions
        id: regressions
        shell: bash
        run: |
          set -o pipefail
          status=0
          for suite in BotPerceptionHostageTest SquadInteractionTest SquadGameplayTest UtilityPropagationTest NativeGunAnimationTest NativeAudioTest KillFirePolishTest IncendiaryProceduralTest TacticalAIRegressionTest MissionObjectiveRegressionTest; do
            if ! timeout 420s godot --headless --path . --fixed-fps 60 "res://tests/$suite.tscn" 2>&1 | tee "/tmp/$suite.log"; then status=1; fi
            if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:' "/tmp/$suite.log"; then status=1; fi
            if ! grep -q 'PASS:' "/tmp/$suite.log"; then status=1; fi
          done
          exit "$status"
      - name: Render moving classic squad
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          pip install Pillow
          set -o pipefail
          mkdir -p /tmp/squad-captures
          SQUAD_CAPTURE_DIR=/tmp/squad-captures LIBGL_ALWAYS_SOFTWARE=1 timeout 180s xvfb-run -a godot --path . --rendering-method gl_compatibility --fixed-fps 60 res://tests/SquadGameplayTest.tscn 2>&1 | tee /tmp/squad-render.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:' /tmp/squad-render.log
          grep -q 'PASS:' /tmp/squad-render.log
          LIBGL_ALWAYS_SOFTWARE=1 timeout 180s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --disable-render-loop --fixed-fps 60 --resolution 1280x720 res://tests/UICustomizationTest.tscn 2>&1 | tee /tmp/UIEditorTest.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:' /tmp/UIEditorTest.log
          grep -q 'PASS:' /tmp/UIEditorTest.log
      - name: Publish corridor_before framebuffer
        if: always()
        run: python tools/publish_squad_capture.py corridor_before
      - name: Publish corridor_yield framebuffer
        if: always()
        run: python tools/publish_squad_capture.py corridor_yield
      - name: Publish corridor_after framebuffer
        if: always()
        run: python tools/publish_squad_capture.py corridor_after
      - name: Publish classic_pose_and_weapon framebuffer
        if: always()
        run: python tools/publish_squad_capture.py classic_pose_and_weapon
      - name: Compare baseline Estate if a mission regresses
        if: ${{ failure() && steps.regressions.outcome == 'failure' }}
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          paths = subprocess.check_output(['git', 'diff', '194a540e', 'HEAD', '--name-only', '--', 'scripts'], text=True).splitlines()
          for path in paths:
              old = subprocess.run(['git', 'show', '194a540e:'+path], capture_output=True)
              if old.returncode == 0:
                  Path(path).write_bytes(old.stdout)
          PY
          set -o pipefail
          timeout 210s godot --headless --path . --fixed-fps 60 res://tests/MissionObjectiveRegressionTest.tscn -- --scenario=estate 2>&1 | tee /tmp/BaselineEstateTest.log
          grep -q 'PASS:' /tmp/BaselineEstateTest.log
      - name: Diagnostic logs
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in [Path('/tmp/squad-import.log'), *Path('/tmp').glob('*Test.log')]:
              if p.exists():
                  text = p.read_text(errors='replace')
                  lines = text.splitlines()
                  errors = []
                  for i, line in enumerate(lines):
                      if any(k in line for k in ['SCRIPT ERROR', 'Parse Error', 'Compile Error', 'FAIL', 'PASS:', '[SQUAD GAMEPLAY]', '[MISSION AI TEST] -', 'ERROR: [', '::error']):
                          errors.extend(lines[i:i+2])
                  message = '\n'.join(errors)[-7000:].replace('%', '%25').replace('\n', '%0A').replace('\r','%0D')
                  print(f'::notice title={p.name}::{message}')
          PY
      - name: Save CI-only imported resources
        if: ${{ always() && !cancelled() && steps.imports.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .godot/imported
          key: ${{ steps.imports.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: squad-systems-logs
          path: |
            /tmp/squad-import.log
            /tmp/*Test.log
            /tmp/squad-render.log
            /tmp/squad-captures/
