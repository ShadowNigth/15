name: Dropped collision and articulated ragdoll QA
on:
  push:
    paths:
      - 'scripts/actors/ActorRagdoll.gd'
      - 'scripts/actors/CSActor.gd'
      - 'scripts/world/DroppedWeapon.gd'
      - 'scripts/core/RoundManager.gd'
      - 'scripts/weapons/WeaponController.gd'
      - 'tests/DropRagdollTest*'
      - '.github/workflows/drop-ragdoll-qa.yml'
  workflow_dispatch:
concurrency:
  group: drop-ragdoll-${{ github.ref }}
  cancel-in-progress: true
jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install engine and renderer
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          pip install pillow gdtoolkit==4.3.4
      - name: Validate and import
        run: |
          set -o pipefail
          python tools/verify_godot_project.py
          godot --headless --path . --import 2>&1 | tee /tmp/drop-import.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:' /tmp/drop-import.log
      - name: Render exact dropped collisions and articulated deaths
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 timeout 1200s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 60 --resolution 960x540 res://tests/DropRagdollTest.tscn 2>&1 | tee /tmp/drop-ragdoll.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|SHADER ERROR|FAIL:' /tmp/drop-ragdoll.log
          grep -q '\[DROP RAGDOLL\] PASS:' /tmp/drop-ragdoll.log
      - name: Diagnostics
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['drop-import','drop-ragdoll']:
              p=Path('/tmp/'+name+'.log')
              if p.exists():
                  lines=list(dict.fromkeys(p.read_text(errors='replace').splitlines()))
                  text='\n'.join(x for x in lines if any(k in x for k in ['[DROP RAGDOLL]','SCRIPT ERROR','ERROR:',' at: ','Error:']))[-6000:]
                  print('::notice title='+name+'::'+text.replace('%','%25').replace('\n','%0A'))
          PY
      - name: Model surface collision overlay
        if: always()
        run: python tools/publish_modern_capture.py drop_surface_collisions
      - name: Rendered ragdoll_start
        if: always()
        run: python tools/publish_modern_capture.py ragdoll_start
      - name: Rendered ragdoll_falling
        if: always()
        run: python tools/publish_modern_capture.py ragdoll_falling
      - name: Rendered ragdoll_rest
        if: always()
        run: python tools/publish_modern_capture.py ragdoll_rest
      - name: Rendered ragdoll_impulse
        if: always()
        run: python tools/publish_modern_capture.py ragdoll_impulse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drop-collision-ragdoll-evidence
          path: |
            /tmp/drop-*.log
            /tmp/modern-captures/
