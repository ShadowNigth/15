name: Modern agents gameplay QA
on:
  push:
    paths:
      - 'assets/models/modern/**'
      - 'tests/ModernAgent*'
      - 'scripts/actors/**'
      - 'scripts/ui/**'
      - 'data/modern_agent*'
      - 'tools/publish_modern_capture.py'
      - 'scripts/actors/PlayerController.gd'
      - 'scripts/core/GameData.gd'
      - 'assets/textures/graffiti/**'
      - 'data/graffiti.json'
      - 'tests/GraffitiTest*'
      - '.github/workflows/modern-agent-import-qa.yml'
  workflow_dispatch:
concurrency:
  group: modern-agents-${{ github.ref }}
  cancel-in-progress: true
jobs:
  modern-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and OpenGL
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          pip install pillow gdtoolkit==4.3.4
      - name: Import and validate
        run: |
          set -o pipefail
          python tools/verify_godot_project.py
          godot --headless --path . --import 2>&1 | tee /tmp/graffiti-import.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:' /tmp/graffiti-import.log
      - name: Render and test native imported agents
        run: |
          set -o pipefail
          MODERN_CAPTURE_DIR=/tmp/modern-captures LIBGL_ALWAYS_SOFTWARE=1 timeout 180s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 60 res://tests/ModernAgentImportTest.tscn 2>&1 | tee /tmp/graffiti.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|SHADER ERROR|FAIL:' /tmp/graffiti.log
          grep -q 'PASS:' /tmp/graffiti.log
      - name: Production characters movement combat death and respawn
        run: |
          set -o pipefail
          MODERN_CAPTURE_DIR=/tmp/modern-captures LIBGL_ALWAYS_SOFTWARE=1 timeout 420s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 60 res://tests/ModernAgentGameplayTest.tscn 2>&1 | tee /tmp/ModernAgentGameplayTest.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|SHADER ERROR|FAIL:' /tmp/ModernAgentGameplayTest.log
          grep -q 'PASS:' /tmp/ModernAgentGameplayTest.log
      - name: Gameplay missions menus and HUD regressions
        run: |
          set -o pipefail
          for suite in CombatNativeIntegrationTest TeamSelectionPresentationTest MainMenuPresentationTest BotCombatDisciplineTest SquadGameplayTest HudColorTest UICustomizationTest; do
            TEAM_CAPTURE_DIR=/tmp/modern-captures MENU_CAPTURE_DIR=/tmp/modern-captures LIBGL_ALWAYS_SOFTWARE=1 timeout 360s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 60 res://tests/$suite.tscn 2>&1 | tee /tmp/$suite.log
            ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|FAIL:' /tmp/$suite.log
            grep -q 'PASS:' /tmp/$suite.log
          done
      - name: Headless mission physics and tactical AI
        run: |
          set -o pipefail
          result=0
          for suite in MissionObjectiveRegressionTest TacticalAIRegressionTest ArchiWeaponRuntimeTest ArchiGameWorldSmokeTest; do
            timeout 600s godot --headless --path . --fixed-fps 60 res://tests/$suite.tscn 2>&1 | tee /tmp/$suite.log || result=1
            if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|FAIL:' /tmp/$suite.log; then result=1; fi
            grep -q 'PASS:' /tmp/$suite.log || result=1
          done
          exit "$result"
      - name: Diagnostics
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in [Path('/tmp/graffiti-import.log'),Path('/tmp/graffiti.log'),*Path('/tmp').glob('*Test.log')]:
              if p.exists():
                  lines=list(dict.fromkeys(p.read_text(errors='replace').splitlines()))
                  text='\n'.join(x for x in lines if any(k in x for k in ['ERROR:', ' at: ', 'FAIL', 'PASS:', '[MODERN GAMEPLAY]', '[ARCHI TEST]', '[ARCHI GAMEWORLD TEST]']))[-3500:]
                  if text: print('::notice title='+p.stem+'::'+text.replace('%','%25').replace('\n','%0A'))
          PY
      - name: Rendered idle
        if: always()
        run: python tools/publish_modern_capture.py modern_live_idle
      - name: Rendered movement
        if: always()
        run: python tools/publish_modern_capture.py modern_live_run
      - name: Rendered crouch grip
        if: always()
        run: python tools/publish_modern_capture.py modern_live_crouch
      - name: Rendered firing grip
        if: always()
        run: python tools/publish_modern_capture.py modern_live_shoot
      - name: Rendered reload grip
        if: always()
        run: python tools/publish_modern_capture.py modern_live_reload
      - name: Rendered team selector
        if: always()
        run: python tools/publish_modern_capture.py team_selection
      - name: Rendered death
        if: always()
        run: python tools/publish_modern_capture.py modern_live_death
      - name: Rendered directional skeletal death
        if: always()
        run: python tools/publish_modern_capture.py modern_death_left
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modern-agent-evidence
          path: |
            /tmp/graffiti*.log
            /tmp/modern-captures/
            /tmp/*Test.log
