name: Wrist inspection evidence
on:
  push:
    paths:
      - '.github/workflows/wrist-evidence-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  wrist-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: compatible-cosmetics-evidence
          run-id: 43091598151
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp
      - run: pip install pillow
      - name: Native cuff midpoint
        run: python tools/publish_modern_capture.py wrist_sas_cs2go_5030_1417_inspect_4
      - name: Native cuff late inspection
        run: python tools/publish_modern_capture.py wrist_sas_cs2go_5030_1417_inspect_8
      - name: Bare forearm midpoint
        run: python tools/publish_modern_capture.py wrist_leet_cs2go_5030_1417_inspect_4
      - name: Legacy cuff midpoint
        run: python tools/publish_modern_capture.py wrist_sas_arid_mw_inspect_4
