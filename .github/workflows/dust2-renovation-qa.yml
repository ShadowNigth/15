name: Dust2 visual renovation QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/world/Dust2Renovation.gd'
      - 'assets/shaders/dust2_sky.gdshader'
      - 'assets/maps/de_dust2_dressing*'
      - 'tools/build_dust2_renovation.py'
      - 'tests/check_dust2_renovation.py'
      - 'scripts/world/MapLoader.gd'
      - 'assets/maps/de_dust2.glb'
      - 'assets/maps/de_dust2.glb.import'
      - 'assets/shaders/goldsrc_world.gdshader'
      - 'tools/polish_dust2.py'
      - 'tools/publish_dust2_capture.py'
      - 'tests/*Dust2*'
      - 'tests/check_dust2_polish.py'
      - '.github/workflows/dust2-renovation-qa.yml'
jobs:
  dust2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DUST2_IMAGE_LIMIT: '10500'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack asset archives (packs/ -> assets/)
        run: python3 tools/pak.py unpack
      - name: Validate texture-preserving repair and create baseline
        run: |
          python tests/check_dust2_polish.py
          python tests/check_dust2_renovation.py
          git show 511be65e61447fd5801e00898a76a369b8d043ff:assets/maps/de_dust2.glb > assets/maps/dust2_baseline.glb
      - name: Install Godot and renderer
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          python -m pip install pillow
      - name: Native import
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/dust2-import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:' /tmp/dust2-import.log; then exit 1; fi
      - name: Physics equivalence, routes, live bots, objectives and OpenGL comparison
        run: |
          set -o pipefail
          timeout 320s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --disable-render-loop --fixed-fps 60 --resolution 1280x720 res://tests/Dust2RenovationTest.tscn 2>&1 | tee /tmp/dust2.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:' /tmp/dust2.log; then exit 1; fi
          grep -q '\[DUST2\] PASS:' /tmp/dust2.log
      - name: Diagnostics
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('dust2-import', 'dust2'):
              p = Path('/tmp/' + name + '.log')
              if p.exists():
                  text = '\n'.join(x for x in p.read_text(errors='replace').splitlines() if any(k in x for k in ['ERROR', 'Error', '[DUST2]']))[-18000:]
                  print('::notice title=Dust2 diagnostics::' + text.replace('%','%25').replace('\n','%0A'))
          PY
      - name: Site B before
        if: always()
        run: python tools/publish_dust2_capture.py dust2_b_before
      - name: Site B after
        if: always()
        run: python tools/publish_dust2_capture.py dust2_b_after
      - name: Site A before
        if: always()
        run: python tools/publish_dust2_capture.py dust2_a_before
      - name: Site A after
        if: always()
        run: python tools/publish_dust2_capture.py dust2_a_after
      - name: CT interior before
        if: always()
        run: python tools/publish_dust2_capture.py dust2_ct_before
      - name: CT interior after
        if: always()
        run: python tools/publish_dust2_capture.py dust2_ct_after
      - name: T exterior before
        if: always()
        run: python tools/publish_dust2_capture.py dust2_t_before
      - name: T exterior after
        if: always()
        run: python tools/publish_dust2_capture.py dust2_t_after
      - name: Facade detail before
        if: always()
        run: python tools/publish_dust2_capture.py dust2_facade_before
      - name: Facade detail after
        if: always()
        run: python tools/publish_dust2_capture.py dust2_facade_after
      - name: Live bots first sample
        if: always()
        run: python tools/publish_dust2_capture.py dust2_gameplay_a
      - name: Live bots second sample
        if: always()
        run: python tools/publish_dust2_capture.py dust2_gameplay_b
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dust2-renovation-comparison
          path: |
            /tmp/dust2*.log
            /tmp/dm-polish-review/dust2_*.png
