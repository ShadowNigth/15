name: Native Godot QA

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test group to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - world
  push:

concurrency:
  group: native-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install static validator
        run: python -m pip install 'gdtoolkit==4.3.4'

      - name: Verify project assets and GDScript AST
        run: python tools/verify_godot_project.py

      - name: Install Godot 4.3
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import project resources and global script classes
        id: native_import
        timeout-minutes: 10
        run: |
          set -o pipefail
          stdbuf -o0 -e0 godot --headless --path . --import 2>&1 | tee /tmp/import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:' /tmp/import.log; then
            echo '::error title=Native import::Godot reported a script compilation error'
            exit 1
          fi

      - name: Smoke mission scene with native autoloads
        if: ${{ inputs.suite != 'world' }}
        timeout-minutes: 2
        run: |
          set -o pipefail
          stdbuf -o0 -e0 godot --headless --path . --quit-after 10 res://tests/MissionObjectiveRegressionTest.tscn -- --scenario=check 2>&1 | tee /tmp/mission-check.log

      - name: OilRig physical escort regression
        if: ${{ inputs.suite != 'world' }}
        timeout-minutes: 4
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 210s stdbuf -o0 -e0 godot --headless --path . --fixed-fps 60 res://tests/MissionObjectiveRegressionTest.tscn -- --scenario=oilrig 2>&1 | tee /tmp/oilrig-mission.log

      - name: Publish mission diagnostics
        if: ${{ always() && inputs.suite != 'world' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('import', 'mission-check', 'oilrig-mission'):
              path = Path('/tmp') / (name + '.log')
              if not path.exists():
                  continue
              for line in path.read_text(errors='replace').splitlines()[-80:]:
                  escaped = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::notice title={name} native log::{escaped}')
          PY

      - name: cs_747 physical hostage regression
        if: ${{ !cancelled() && steps.native_import.outcome == 'success' && inputs.suite != 'world' }}
        timeout-minutes: 8
        run: godot --headless --path . --fixed-fps 60 res://tests/MissionObjectiveRegressionTest.tscn -- --scenario=747

      - name: cs_estate physical hostage regression
        if: ${{ !cancelled() && steps.native_import.outcome == 'success' && inputs.suite != 'world' }}
        timeout-minutes: 8
        run: godot --headless --path . --fixed-fps 60 res://tests/MissionObjectiveRegressionTest.tscn -- --scenario=estate

      - name: Weapon runtime regression
        if: ${{ !cancelled() && steps.native_import.outcome == 'success' && inputs.suite != 'world' }}
        run: godot --headless --path . res://tests/ArchiWeaponRuntimeTest.tscn

      - name: Procedural fire regression
        if: ${{ !cancelled() && steps.native_import.outcome == 'success' }}
        run: godot --headless --path . --fixed-fps 60 res://tests/IncendiaryProceduralTest.tscn

      - name: Original textures, surface and water regression
        if: ${{ !cancelled() && steps.native_import.outcome == 'success' }}
        run: godot --headless --path . --fixed-fps 60 res://tests/MapSurfaceWaterTest.tscn

      - name: Tactical AI regression
        if: ${{ !cancelled() && steps.native_import.outcome == 'success' }}
        run: godot --headless --path . --fixed-fps 60 res://tests/TacticalAIRegressionTest.tscn

      - name: Game world smoke regression
        if: ${{ !cancelled() && steps.native_import.outcome == 'success' }}
        timeout-minutes: 12
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 660s stdbuf -o0 -e0 godot --headless --path . --fixed-fps 60 res://tests/ArchiGameWorldSmokeTest.tscn 2>&1 | tee /tmp/gameworld-smoke.log

      - name: Publish failed world diagnostics
        if: ${{ failure() }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/gameworld-smoke.log')
          if path.exists():
              for line in path.read_text(errors='replace').splitlines()[-120:]:
                  escaped = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::notice title=Game world native log::{escaped}')
          PY
