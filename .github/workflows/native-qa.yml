name: Native Godot QA

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test group to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - world
  push:

concurrency:
  group: native-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install static validator
        run: python -m pip install 'gdtoolkit==4.3.4'

      - name: Verify project assets and GDScript AST
        run: |
          python tools/verify_godot_project.py
          python tests/check_knife_assets.py

      - name: Install Godot 4.3
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import project resources and global script classes
        id: native_import
        timeout-minutes: 10
        run: |
          set -o pipefail
          stdbuf -o0 -e0 godot --headless --path . --import 2>&1 | tee /tmp/import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:' /tmp/import.log; then
            echo '::error title=Native import::Godot reported a script compilation error'
            exit 1
          fi

      - name: Three-knife loadout gameplay regression
        timeout-minutes: 5
        run: |
          set -o pipefail
          timeout 240s godot --headless --path . --fixed-fps 60 res://tests/KnifeLoadoutTest.tscn 2>&1 | tee /tmp/knife-test.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:' /tmp/knife-test.log; then exit 1; fi
          grep -q '\[KNIFE TEST\] PASS:' /tmp/knife-test.log

      - name: Publish knife test diagnostics
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          log = Path('/tmp/knife-test.log')
          if log.exists():
              text = '\n'.join(log.read_text(errors='replace').splitlines()[-40:])
              text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::notice title=Knife test::{text}')
          PY

      - name: Smoke mission scene with native autoloads
        if: ${{ inputs.suite != 'world' }}
        timeout-minutes: 2
        run: |
          set -o pipefail
          stdbuf -o0 -e0 godot --headless --path . --quit-after 10 res://tests/MissionObjectiveRegressionTest.tscn -- --scenario=check 2>&1 | tee /tmp/mission-check.log

      - name: OilRig physical escort regression
        if: ${{ inputs.suite != 'world' }}
        timeout-minutes: 4
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 210s stdbuf -o0 -e0 godot --headless --path . --fixed-fps 60 res://tests/MissionObjectiveRegressionTest.tscn -- --scenario=oilrig 2>&1 | tee /tmp/oilrig-mission.log

      - name: Publish mission diagnostics
        if: ${{ always() && inputs.suite != 'world' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('import', 'mission-check', 'oilrig-mission'):
              path = Path('/tmp') / (name + '.log')
              if not path.exists():
                  continue
              for line in path.read_text(errors='replace').splitlines()[-80:]:
                  escaped = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::notice title={name} native log::{escaped}')
          PY

      - name: cs_747 physical hostage regression
        if: ${{ !cancelled() && steps.native_import.outcome == 'success' && inputs.suite != 'world' }}
        timeout-minutes: 8
        run: godot --headless --path . --fixed-fps 60 res://tests/MissionObjectiveRegressionTest.tscn -- --scenario=747

      - name: cs_estate physical hostage regression
        if: ${{ !cancelled() && steps.native_import.outcome == 'success' && inputs.suite != 'world' }}
        timeout-minutes: 8
        run: godot --headless --path . --fixed-fps 60 res://tests/MissionObjectiveRegressionTest.tscn -- --scenario=estate

      - name: Weapon runtime regression
        if: ${{ !cancelled() && steps.native_import.outcome == 'success' && inputs.suite != 'world' }}
        run: godot --headless --path . res://tests/ArchiWeaponRuntimeTest.tscn

      - name: Procedural fire regression
        if: ${{ !cancelled() && steps.native_import.outcome == 'success' }}
        run: godot --headless --path . --fixed-fps 60 res://tests/IncendiaryProceduralTest.tscn

      - name: Original textures, surface and water regression
        if: ${{ !cancelled() && steps.native_import.outcome == 'success' }}
        run: godot --headless --path . --fixed-fps 60 res://tests/MapSurfaceWaterTest.tscn

      - name: Tactical AI regression
        if: ${{ !cancelled() && steps.native_import.outcome == 'success' }}
        run: godot --headless --path . --fixed-fps 60 res://tests/TacticalAIRegressionTest.tscn

      - name: Game world smoke regression
        if: ${{ !cancelled() && steps.native_import.outcome == 'success' }}
        timeout-minutes: 12
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 660s stdbuf -o0 -e0 godot --headless --path . --fixed-fps 60 res://tests/ArchiGameWorldSmokeTest.tscn 2>&1 | tee /tmp/gameworld-smoke.log

      - name: Publish failed world diagnostics
        if: ${{ failure() }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/gameworld-smoke.log')
          if path.exists():
              for line in path.read_text(errors='replace').splitlines()[-120:]:
                  escaped = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::notice title=Game world native log::{escaped}')
          PY

      - name: Render task 48 mission gameplay with OpenGL
        if: ${{ success() && inputs.suite != 'world' }}
        timeout-minutes: 12
        env:
          TASK48_CAPTURE_DIR: /tmp/task48-captures
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          set -o pipefail
          timeout 540s xvfb-run -a godot --path . --rendering-method gl_compatibility --rendering-driver opengl3 --disable-render-loop --fixed-fps 60 --resolution 960x540 res://tests/Task48VisualQA.tscn 2>&1 | tee /tmp/task48-render.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:' /tmp/task48-render.log; then exit 1; fi
          test -f /tmp/task48-captures/manifest.json

      - name: Publish rendered evidence diagnostics
        if: ${{ always() && inputs.suite != 'world' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          log = Path('/tmp/task48-render.log')
          if log.exists():
              text = '\n'.join(log.read_text(errors='replace').splitlines()[-45:])
              escaped = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::notice title=Task48 renderer log::{escaped}')
          PY

      - name: Inspect OilRig rendered capture
        if: ${{ !cancelled() && inputs.suite != 'world' }}
        run: python3 tools/publish_rendered_capture.py as_oilrig

      - name: Inspect 747 rendered capture
        if: ${{ !cancelled() && inputs.suite != 'world' }}
        run: python3 tools/publish_rendered_capture.py cs_747

      - name: Inspect Estate rendered capture
        if: ${{ !cancelled() && inputs.suite != 'world' }}
        run: python3 tools/publish_rendered_capture.py cs_estate

      - name: Save task 48 rendered evidence
        if: ${{ !cancelled() && inputs.suite != 'world' }}
        uses: actions/upload-artifact@v4
        with:
          name: task48-rendered-gameplay
          path: /tmp/task48-captures/
          if-no-files-found: ignore
          retention-days: 14

      - name: Render new knives in real gameplay with OpenGL
        if: ${{ success() && inputs.suite != 'world' }}
        timeout-minutes: 6
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          timeout 300s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --rendering-driver opengl3 --disable-render-loop --fixed-fps 60 --resolution 960x540 res://tests/KnifeLoadoutTest.tscn -- --capture 2>&1 | tee /tmp/knife-render.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:' /tmp/knife-render.log; then exit 1; fi
          grep -q '\[KNIFE TEST\] PASS:' /tmp/knife-render.log

      - name: Inspect karambit_idle rendered capture
        if: ${{ !cancelled() && inputs.suite != 'world' }}
        run: python3 tools/publish_rendered_capture.py karambit_idle

      - name: Inspect karambit_inspect rendered capture
        if: ${{ !cancelled() && inputs.suite != 'world' }}
        run: python3 tools/publish_rendered_capture.py karambit_inspect

      - name: Inspect m9_idle rendered capture
        if: ${{ !cancelled() && inputs.suite != 'world' }}
        run: python3 tools/publish_rendered_capture.py m9_idle

      - name: Inspect m9_inspect rendered capture
        if: ${{ !cancelled() && inputs.suite != 'world' }}
        run: python3 tools/publish_rendered_capture.py m9_inspect

      - name: Inspect bayonet_idle rendered capture
        if: ${{ !cancelled() && inputs.suite != 'world' }}
        run: python3 tools/publish_rendered_capture.py bayonet_idle

      - name: Inspect bayonet_inspect rendered capture
        if: ${{ !cancelled() && inputs.suite != 'world' }}
        run: python3 tools/publish_rendered_capture.py bayonet_inspect

      - name: Save knife rendered evidence
        if: ${{ !cancelled() && inputs.suite != 'world' }}
        uses: actions/upload-artifact@v4
        with:
          name: knife-rendered-gameplay
          path: /tmp/knife-captures/
          if-no-files-found: error
          retention-days: 14

  build-downloads:
    needs: native-tests
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[build-game]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and PC export templates
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 -o /tmp/templates.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -j -q /tmp/templates.zip 'templates/windows_release_x86_64.exe' 'templates/linux_release.x86_64' -d ~/.local/share/godot/export_templates/4.3.stable
      - name: Import and export standalone games
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/export-import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:' /tmp/export-import.log; then exit 1; fi
          mkdir -p export/windows export/linux
          godot --headless --path . --export-release 'Windows Desktop' export/windows/CounterStrike15.exe 2>&1 | tee /tmp/windows-export.log
          godot --headless --path . --export-release Linux export/linux/CounterStrike15.x86_64 2>&1 | tee /tmp/linux-export.log
          test -s export/windows/CounterStrike15.exe
          test -s export/windows/CounterStrike15.pck
          test -s export/linux/CounterStrike15.x86_64
          test -s export/linux/CounterStrike15.pck
      - name: Smoke test exported Linux game and data
        run: |
          set -o pipefail
          chmod +x export/linux/CounterStrike15.x86_64
          cd export/linux
          timeout 90s ./CounterStrike15.x86_64 --headless --audio-driver Dummy --quit-after 30 2>&1 | tee /tmp/exported-game.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|Missing JSON|Failed loading resource|Error loading resource' /tmp/exported-game.log; then exit 1; fi
      - name: Package ZIP downloads and checksums
        run: |
          for platform in windows linux; do
            cp docs/PLAY_RELEASE.txt export/$platform/LEEME.txt
            cp docs/KNIFE_ASSET_NOTICES.md export/$platform/
            cp README.md export/$platform/PROJECT_README.md
            printf 'Commit: %s\n' "$GITHUB_SHA" > export/$platform/VERSION.txt
          done
          (cd export/windows && zip -q -r ../CounterStrike15-Windows-x64.zip .)
          (cd export/linux && zip -q -r ../CounterStrike15-Linux-x64.zip .)
          (cd export && sha256sum CounterStrike15-*.zip > SHA256SUMS.txt)
          unzip -tq export/CounterStrike15-Windows-x64.zip
          unzip -tq export/CounterStrike15-Linux-x64.zip
      - name: Stage downloadable release for visual approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="knives-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          gh release create "$TAG" export/CounterStrike15-Windows-x64.zip export/CounterStrike15-Linux-x64.zip export/SHA256SUMS.txt --draft --target "$GITHUB_SHA" --title 'Three new knives — standalone PC builds' --notes 'Karambit Gamma Doppler, M9 Bayonet Gamma Doppler, Bayonet Ruby. Original knife, arms, gloves and gameplay retained. Extract the complete ZIP; no Godot installation required. See included third-party asset notices. Native gameplay and OpenGL QA passed before packaging.'
