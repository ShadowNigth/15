name: Third-person weapon grip QA
on:
  push:
    paths:
      - 'scripts/actors/CSActor.gd'
      - 'scripts/actors/HeldWeaponGrip.gd'
      - 'scripts/actors/ModernAgentPose.gd'
      - 'assets/models/held/**'
      - 'data/held_weapon_grips.json'
      - 'tests/HeldWeaponGripTest*'
      - '.github/workflows/held-weapon-grip-qa.yml'
  workflow_dispatch:
concurrency:
  group: held-grip-${{ github.ref }}
  cancel-in-progress: true
jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install engine and renderer
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          pip install pillow gdtoolkit==4.3.4
      - name: Validate and import
        run: |
          set -o pipefail
          python tools/verify_godot_project.py
          godot --headless --path . --import 2>&1 | tee /tmp/held-import.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:' /tmp/held-import.log
      - name: Render all firearms utility and knife grips
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 timeout 600s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 60 --resolution 960x540 res://tests/HeldWeaponGripTest.tscn 2>&1 | tee /tmp/held-grip.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|SHADER ERROR|FAIL:' /tmp/held-grip.log
          grep -q '\[HELD GRIP\] PASS:' /tmp/held-grip.log
      - name: Diagnostics
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['held-import','held-grip']:
              p=Path('/tmp/'+name+'.log')
              if p.exists():
                  lines=list(dict.fromkeys(p.read_text(errors='replace').splitlines()))
                  text='\n'.join(x for x in lines if any(k in x for k in ['[HELD GRIP]','SCRIPT ERROR','ERROR:',' at: ','Error:']))[-6000:]
                  print('::notice title='+name+'::'+text.replace('%','%25').replace('\n','%0A'))
          PY
      - name: Evidence contact sheets
        if: always()
        run: |
          python tools/publish_held_grips.py
          for name in held_firearms held_tools held_knives; do
            python tools/publish_modern_capture.py "$name" 0
            python tools/publish_modern_capture.py "$name" 1
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: third-person-grip-evidence
          path: |
            /tmp/held-*.log
            /tmp/modern-captures/
