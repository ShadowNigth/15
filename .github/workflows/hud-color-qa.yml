name: HUD colour and RGB QA
on:
  push:
    paths:
      - 'scripts/ui/CSHud.gd'
      - 'scripts/ui/UICustomization.gd'
      - 'scripts/ui/UICustomizationEditor.gd'
      - 'scripts/world/GameWorld.gd'
      - 'assets/ui/knives/**'
      - 'tests/HudColorTest*'
      - 'tools/publish_hud_color_capture.py'
      - '.github/workflows/hud-color-qa.yml'
  workflow_dispatch:
concurrency:
  group: hud-color-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and OpenGL
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          pip install pillow gdtoolkit==4.3.4
      - name: Validate and import
        id: compile
        run: |
          set -o pipefail
          python tools/verify_godot_project.py
          godot --headless --path . --import 2>&1 | tee /tmp/hud-color-import.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:' /tmp/hud-color-import.log
      - name: Render native gameplay HUD and equipped knife
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          set -o pipefail
          HUD_CAPTURE_DIR=/tmp/hud-captures LIBGL_ALWAYS_SOFTWARE=1 timeout 300s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 60 res://tests/HudColorTest.tscn 2>&1 | tee /tmp/hud-color-runtime.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|SHADER ERROR' /tmp/hud-color-runtime.log
          grep -q 'PASS:' /tmp/hud-color-runtime.log
      - name: Native preview and editor regressions
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          set -o pipefail
          status=0
          for suite in UICustomizationTest; do
            if ! timeout 420s godot --headless --path . --fixed-fps 60 res://tests/$suite.tscn 2>&1 | tee /tmp/$suite.log; then status=1; fi
            if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:' /tmp/$suite.log; then status=1; fi
            if ! grep -q 'PASS:' /tmp/$suite.log; then status=1; fi
          done
          exit "$status"
      - name: Menu diagnostics
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename in ['hud-color-import', 'hud-color-runtime', 'NativeGunAnimationTest', 'KnifeLoadoutTest', 'UICustomizationTest']:
              p = Path('/tmp') / (filename + '.log')
              if p.exists():
                  lines = p.read_text(errors='replace').splitlines()
                  text = '\n'.join(x for x in lines if any(k in x for k in ['ERROR', 'Error', 'FAIL', 'PASS:']))[-6500:]
                  print('::notice title='+filename+'::'+text.replace('%','%25').replace('\n','%0A'))
          PY
      - name: hud_color_fixed framebuffer
        if: always()
        run: python tools/publish_hud_color_capture.py hud_color_fixed
      - name: hud_color_rgb framebuffer
        if: always()
        run: python tools/publish_hud_color_capture.py hud_color_rgb
      - name: hud_color_gameplay framebuffer
        if: always()
        run: python tools/publish_hud_color_capture.py hud_color_gameplay
      - name: hud_color_editor_4x3 framebuffer
        if: always()
        run: python tools/publish_hud_color_capture.py hud_color_editor_4x3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hud-color-evidence
          path: |
            /tmp/hud-*.log
            /tmp/*Test.log
            /tmp/hud-captures/
